# yaml-language-server: $schema=../../bundle_config_schema.json
# Adds, updates, recreates, and deletes UC secrets while changing only the
# pipeline cascade policy retained from before/.
bundle:
  name: dagshund-golden-uc-secrets-pipeline-cascade
  databricks_cli_version: ">=1.14.0"
  engine: direct

variables:
  created_secret_value:
    description: Fake created fixture value, supplied through BUNDLE_VAR_created_secret_value
  updated_secret_value_after:
    description: Fake post-update fixture value, supplied through BUNDLE_VAR_updated_secret_value_after
  recreated_secret_value:
    description: Fake fixture value, supplied through BUNDLE_VAR_recreated_secret_value
  grants_secret_value:
    description: Fake grants fixture value, supplied through BUNDLE_VAR_grants_secret_value

resources:
  schemas:
    cli_resources:
      catalog_name: dagshund
      name: cli_resources
      comment: Dagshund CLI resource fixture

  secrets:
    created_secret:
      catalog_name: dagshund
      schema_name: ${resources.schemas.cli_resources.name}
      name: created_secret
      value: ${var.created_secret_value}

    updated_secret:
      catalog_name: dagshund
      schema_name: ${resources.schemas.cli_resources.name}
      name: updated_secret
      comment: After update
      value: ${var.updated_secret_value_after}

    recreated_secret:
      catalog_name: dagshund
      schema_name: ${resources.schemas.cli_resources.name}
      name: recreated_secret_after
      value: ${var.recreated_secret_value}

    grants_secret:
      catalog_name: dagshund
      schema_name: ${resources.schemas.cli_resources.name}
      name: grants_secret
      value: ${var.grants_secret_value}
      grants:
        - principal: data_engineers
          privileges:
            - READ_SECRET
        - principal: data_analysts
          privileges:
            - READ_SECRET

  pipelines:
    update_cascade_only:
      name: cli_resources_update_cascade_only
      catalog: dagshund
      target: models
      serverless: true
      cascade_on_destroy: true
      event_log:
        catalog: dagshund
        schema: ${resources.schemas.cli_resources.name}
        name: pipeline_events
      libraries:
        - notebook:
            path: ./pipeline.py
