# yaml-language-server: $schema=../../bundle_config_schema.json
# Second deploy: the ETL pipeline has matured enough to plug in experiment
# tracking, a secret-backed external API call, LLM inference, and natural
# language exploration. Changes the bundle-owned Genie space permission,
# adds a model_serving_endpoint as a bundle-owned resource, and wires four
# new refs into the app: taxi_genie (Genie space), experiment_tracker
# (bundle-owned experiment), api_token (CLI-managed phantom secret), and
# chat_model (new endpoint).
# Plan should show:
#   ~ genie_spaces/nyc_taxi_genie               (permission update)
#   + model_serving_endpoints/app_chat_endpoint (create)
#   ~ apps/my_test_app                         (update — 4 resource refs added)
bundle:
  name: dagshund-golden-app-deps
  databricks_cli_version: ">=0.296.0"
  engine: direct

include:
  - ../../externals.yaml

resources:
  apps:
    my_test_app:
      name: my-test-app
      description: Test app with all resource dependency types
      source_code_path: ./app_src
      resources:
        - name: etl_job
          job:
            id: ${resources.jobs.my_etl_job.id}
            permission: CAN_MANAGE_RUN
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: volume_data
          uc_securable:
            securable_full_name: ${var.catalog_name}.${var.models_schema}.${var.volume_name}
            securable_type: VOLUME
            permission: READ_VOLUME
        - name: taxi_genie
          genie_space:
            name: nyc_taxi_genie
            space_id: ${resources.genie_spaces.nyc_taxi_genie.id}
            permission: CAN_RUN
        - name: experiment_tracker
          experiment:
            experiment_id: ${resources.experiments.my_experiment.id}
            permission: CAN_READ
        - name: api_token
          secret:
            scope: app_secrets
            key: external_api_token
            permission: READ
        - name: chat_model
          serving_endpoint:
            name: ${resources.model_serving_endpoints.app_chat_endpoint.name}
            permission: CAN_QUERY

  jobs:
    my_etl_job:
      name: my_etl_job
      tasks:
        - task_key: run
          notebook_task:
            notebook_path: /Workspace/app/run

  experiments:
    my_experiment:
      name: /Workspace/experiments/my_experiment

  genie_spaces:
    nyc_taxi_genie:
      title: NYC Taxi Trip Analysis
      description: Ask questions about NYC taxi trip data in natural language
      warehouse_id: ${var.warehouse_id}
      file_path: ./nyc_taxi_genie.geniespace.json
      permissions:
        - level: CAN_MANAGE
          group_name: users

  model_serving_endpoints:
    app_chat_endpoint:
      name: app_chat_endpoint
      config:
        served_entities:
          - entity_name: ${var.catalog_name}.${var.phantom_schema}.phantom_model
            entity_version: "1"
            workload_size: Small
            scale_to_zero_enabled: true
