# yaml-language-server: $schema=../../bundle_config_schema.json
# After state of the deploy-triggered-runs story. All five jobs are untouched;
# only the run entries change, one lifecycle per job:
#   nightly_report     — seed_report unchanged            → skip
#   schema_migration   — apply_migrations tag v1 → v2     → recreate
#   seed_lookup_tables — initial_seed is new              → create
#   smoke_check        — one_off_audit removed            → delete
#   cache_warmup       — warm_us_cache unchanged (skip) + warm_eu_cache new
#                        (create) — multi-trigger with mixed states
#   phantom_job (external) — ping_healthcheck is new      → create, targets a
#                        job outside the bundle (orphan → phantom node)
bundle:
  name: dagshund-golden-job-runs
  databricks_cli_version: ">=1.7.0"
  engine: direct

include:
  - ../../externals.yaml

resources:
  jobs:
    nightly_report:
      name: nightly_report
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./run_task.py

    schema_migration:
      name: schema_migration
      parameters:
        - name: migration_version
          default: ""
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./run_task.py

    seed_lookup_tables:
      name: seed_lookup_tables
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./run_task.py

    smoke_check:
      name: smoke_check
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./run_task.py

    cache_warmup:
      name: cache_warmup
      parameters:
        - name: region
          default: ""
      tasks:
        - task_key: main
          notebook_task:
            notebook_path: ./run_task.py

  job_runs:
    seed_report:
      job_id: ${resources.jobs.nightly_report.id}

    # Bumped tag re-fires the migration run (delete old record + fresh RunNow).
    apply_migrations:
      job_id: ${resources.jobs.schema_migration.id}
      job_parameters:
        migration_version: v2

    # First deploy-triggered run for this job.
    initial_seed:
      job_id: ${resources.jobs.seed_lookup_tables.id}

    warm_us_cache:
      job_id: ${resources.jobs.cache_warmup.id}
      job_parameters:
        region: us

    # New regional warmup — fires alongside warm_us_cache's standing record.
    warm_eu_cache:
      job_id: ${resources.jobs.cache_warmup.id}
      job_parameters:
        region: eu

    # Targets the pre-existing phantom_job (see externals.yaml), which lives
    # outside this bundle — the run's job is an orphan numeric target for the
    # visualizer. Deploy fires it once; destroy erases the record from the
    # external job's history via jobs/runs/delete.
    ping_healthcheck:
      job_id: ${var.external_job_id}
